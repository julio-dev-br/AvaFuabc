<div class="login-container"
    style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-page); padding: 24px; box-sizing: border-box; font-family: sans-serif; transition: background-color 0.25s ease;">
    <div style="max-width: 420px; width: 100%; box-sizing: border-box; animation: fadeIn 0.4s ease;">

        <div style="text-align: center; margin-bottom: 24px;">
            <div
                style="background: linear-gradient(135deg, #003366 0%, #0284c7 100%); color: #ffffff; width: 54px; height: 54px; display: inline-flex; align-items: center; justify-content: center; border-radius: 14px; margin-bottom: 12px; box-shadow: var(--card-shadow);">
                <mat-icon
                    style="font-size: 28px; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;">school</mat-icon>
            </div>
            <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: var(--text-brand); letter-spacing: -0.5px;">Portal de
                Treinamentos FUABC</h2>
            <p style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 13px; font-weight: 500;">Ambiente Virtual de
                Aprendizagem Regulamentar</p>
        </div>

        <mat-card
            style="border-radius: 16px; box-shadow: var(--card-shadow) !important; border: 1px solid var(--border-color); overflow: hidden; background: var(--bg-card);">

            <mat-progress-bar *ngIf="isLoading" mode="indeterminate"
                style="height: 4px; margin-bottom: -4px; position: relative; z-index: 10;"></mat-progress-bar>

            <div style="padding: 32px 24px 24px 24px; box-sizing: border-box;">
                <form (ngSubmit)="onSubmit()" #loginForm="ngForm"
                    style="display: flex; flex-direction: column; gap: 16px; width: 100%;">

                    <mat-form-field appearance="outline" style="width: 100%;" class="compact-form">
                        <mat-label>CPF</mat-label>
                        <input matInput 
                            type="text" 
                            name="cpf" 
                            [(ngModel)]="cpf" 
                            (input)="aplicarMascaraCpf($event)"
                            [disabled]="isLoading"
                            placeholder="000.000.000-00" 
                            maxlength="14" 
                            required>
                        <mat-icon matPrefix style="color: var(--text-muted); margin-right: 8px;">badge</mat-icon>
                    </mat-form-field>

                    <mat-form-field appearance="outline" style="width: 100%;" class="compact-form">
                        <mat-label>Senha</mat-label>
                        <input matInput type="password" name="password" [(ngModel)]="password" [disabled]="isLoading"
                            placeholder="Digite sua senha" required>
                        <mat-icon matPrefix style="color: var(--text-muted); margin-right: 8px;">lock</mat-icon>
                    </mat-form-field>

                    <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 16px; width: 100%;">
                        <button mat-raised-button type="submit"
                            [style.background]="isLoading || !cpf || !password ? 'var(--bg-subtle)' : 'linear-gradient(135deg, #003366 0%, #0284c7 100%)'"
                            [style.color]="isLoading || !cpf || !password ? 'var(--text-muted)' : '#ffffff'"
                            [style.border]="isLoading || !cpf || !password ? '1px solid var(--border-color)' : 'none'"
                            style="width: 100%; height: 44px; font-weight: 700; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--card-shadow); transition: all 0.3s ease;"
                            [disabled]="isLoading || !cpf || !password">
                            <mat-icon style="font-size: 18px; width: 18px; height: 18px;">login</mat-icon>
                            {{ isLoading ? 'Autenticando...' : 'Entrar na Conta' }}
                        </button>

                        <div
                            style="text-align: center; font-size: 13px; color: var(--text-muted); font-weight: 500; margin-top: 4px; width: 100%;">
                            Não possui uma conta acadêmica?
                            <a routerLink="/cadastro"
                                style="color: var(--text-brand); font-weight: 700; text-decoration: none;">Cadastre-se aqui</a>
                        </div>
                    </div>

                </form>
            </div>
        </mat-card>
    </div>
</div>
